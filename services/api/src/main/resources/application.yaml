spring:
  application:
    name: firstwork-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/firstwork}
    username: ${DATABASE_USER:firstwork}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 1000
  jdbc:
    template:
      query-timeout: 3
  flyway:
    enabled: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100
    accept-count: 20
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
logging:
  structured:
    format:
      console: ecs
