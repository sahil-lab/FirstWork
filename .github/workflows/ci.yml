name: FirstWork phase 1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firstwork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker
        run: |
          docker version
          docker compose version
      - name: Initialize synthetic local configuration
        run: >
          docker compose -p firstwork -f infra/docker/compose.yaml --profile tools run
          --rm --no-deps web-check node scripts/initialize-local.mjs
      - name: Verify Java formatting, tests, and package
        run: >
          docker compose -p firstwork -f infra/docker/compose.yaml --profile tools run
          --rm --no-deps api-check
      - name: Verify frontend formatting, lint, types, tests, and build
        run: >
          docker compose -p firstwork -f infra/docker/compose.yaml --profile tools run
          --rm --no-deps web-check
      - name: Start isolated runtime stack
        run: >
          docker compose -p firstwork -f infra/docker/compose.yaml up --detach --build
          --wait --wait-timeout 180 db api web
      - name: Run actual browser smoke tests
        run: >
          docker compose -p firstwork -f infra/docker/compose.yaml --profile tools run
          --rm --no-deps smoke
      - name: Runtime diagnostics on failure
        if: failure()
        run: |
          docker compose -p firstwork -f infra/docker/compose.yaml ps
          docker compose -p firstwork -f infra/docker/compose.yaml logs --tail 80 api web db
      - name: Stop only this job's stack
        if: always()
        run: docker compose -p firstwork -f infra/docker/compose.yaml stop
